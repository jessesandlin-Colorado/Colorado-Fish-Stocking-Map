name: Build historical snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-historical-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build fixed 2014-2025 historical database
        run: python scripts/build_archive_snapshot.py
      - name: Run tests
        run: python -m pytest -q
      - name: Commit reviewed historical snapshot inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stocking.sqlite3 data/stocking_events.json
          if git diff --cached --quiet; then
            echo "No historical snapshot changes"
          else
            git commit -m "Build fixed 2014-2025 historical snapshot"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
