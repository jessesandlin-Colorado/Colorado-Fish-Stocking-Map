name: Refresh CPW data

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/classify_atlas_only_waters.py"
      - "scripts/compare_atlas_inventory.py"
      - "scripts/import_atlas_catalog.py"
      - "scripts/import_2026_archive.py"
      - "scripts/merge_archive_waters.py"
      - "scripts/stocking_database.py"
      - "scripts/update_data.py"
      - ".github/workflows/update-data.yml"
  schedule:
    # Saturday morning after CPW's typical Friday report update.
    - cron: "30 13 * * 6"

permissions:
  contents: write

concurrency:
  group: refresh-cpw-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore Atlas response cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: atlas-cache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            atlas-cache-${{ runner.os }}-
      - name: Check whether the 2026 archive needs a one-time import
        id: archive_check
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("data/stocking_events.json")
          payload = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          events_2026 = int((payload.get("summary", {}).get("events_by_year", {}) or {}).get("2026", 0))
          needed = events_2026 == 0
          print(f"Committed 2026 archive events: {events_2026}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"needed={'true' if needed else 'false'}\n")
          PY
      - name: Import the published CPW 2026 worksheet once
        if: steps.archive_check.outputs.needed == 'true'
        run: python scripts/import_2026_archive.py
      - name: Fetch and validate current CPW map data
        run: python scripts/update_data.py --strict
      - name: Merge committed historical database
        run: python scripts/merge_archive_waters.py
      - name: Enrich waters with official Fishing Atlas species
        run: python scripts/enrich_atlas_species.py
      - name: Compare complete Fishing Atlas inventory
        run: python scripts/compare_atlas_inventory.py
      - name: Classify Atlas-only waters conservatively
        run: python scripts/classify_atlas_only_waters.py
      - name: Import cleaned public Fishing Atlas catalog
        run: python scripts/import_atlas_catalog.py
      - name: Run tests
        run: python -m pytest -q
      - name: Commit refreshed data and catalog reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/waters.json data/unmatched.json data/match-report.html \
                  data/stocking-history.json data/import-history.json \
                  data/stocking_events.json data/stocking.sqlite3 \
                  data/species.json data/validation.json data/validation-report.html \
                  data/archive-merge-report.json \
                  data/atlas-inventory-comparison.json \
                  data/atlas-only-waters-review.csv \
                  data/atlas-inventory-report.md \
                  data/atlas-inventory-classified.json \
                  data/atlas-only-waters-classified.csv \
                  data/atlas-only-classification-report.md \
                  data/atlas-catalog-import-report.json
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi

          git commit -m "Refresh CPW data and import Fishing Atlas catalog"

          # The refresh can run for several minutes. Rebase its generated-data
          # commit onto any UI or code changes that reached main meanwhile.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push raced with another update; retrying (${attempt}/3)..."
            sleep $((attempt * 5))
          done

          echo "Unable to push refreshed data after 3 attempts."
          exit 1
