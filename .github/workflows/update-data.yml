name: Refresh CPW data

on:
  workflow_dispatch:
  schedule:
    # Saturday morning after CPW's typical Friday report update.
    - cron: "30 13 * * 6"

permissions:
  contents: write

concurrency:
  group: refresh-cpw-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore Atlas response cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: atlas-cache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            atlas-cache-${{ runner.os }}-
      - name: Fetch and validate current CPW map data
        run: python scripts/update_data.py --strict
      - name: Bootstrap archive and append current report
        run: python scripts/stocking_database.py all
      - name: Run tests
        run: python -m pytest -q
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/waters.json data/unmatched.json data/match-report.html \
                  data/stocking-history.json data/import-history.json \
                  data/species.json data/validation.json data/validation-report.html \
                  data/stocking.sqlite3 data/stocking_events.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh CPW stocking data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
